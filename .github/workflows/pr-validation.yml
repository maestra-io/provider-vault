name: PR Validation

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

# Cancel an in-flight run when a new push lands on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    # GitHub-hosted — the build is just two small Go binaries + a unit test,
    # no self-hosted runner needed (ubuntu-latest already ships make + gcc).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # setup-*-nora: the toolchain from nora
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: maestra-io/github-actions/setup-go-nora@f40b5191253ae7e28c10836989a77255666141e4 # v1.104.0
        with:
          go-version-file: 'go.mod'

      - name: Verify dependencies
        run: go mod verify

      - name: Build (full-module compile)
        run: make build

      - name: Run unit tests (config/database create-only password diff)
        run: make test
