name: Release

# Single serialized release queue: a second tag push (or workflow_dispatch)
# waits for the in-flight run to finish instead of cancelling it. Half-pushed
# multi-arch images / xpkgs aren't safe to abandon mid-flight.
concurrency: release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  # Manual trigger so a failed ECR push or transient signing error can be
  # retried without retagging — pick any existing tag from the dropdown.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)release. Must already exist on the repo."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPOSITORY: provider-vault
  TELEPORT_FQDN: teleport.maestra.io:443
  TELEPORT_TOKEN: image-push-github-actions-provider-vault
  AWS_ROLE_ARN: arn:aws:iam::515260921971:role/teleport-image-push

jobs:
  test:
    name: Test
    # GitHub-hosted — ubuntu-latest already ships make + gcc.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Verify dependencies
        run: go mod verify

      - name: Build (full-module compile)
        run: make build

      - name: Run unit tests (config/database create-only password diff)
        run: make test

  image:
    name: Build & push image + xpkg
    needs: test
    # GitHub-hosted. The build is two small Go binaries + a distroless image +
    # an xpkg — well within ubuntu-latest's disk; no self-hosted runner needed.
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # Teleport WI OIDC + cosign keyless
    env:
      IMAGE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # On workflow_dispatch (re-)release the requested tag, not main.
          ref: ${{ inputs.tag || github.ref }}
          # full history so the release-notes changelog (PREV_TAG..HEAD) works.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Install crossplane CLI
        # Pinned release + sha256 instead of `curl install.sh | sh` from main
        # (issues-maestra#1649 10.1): stable/current was serving v2.5.0, which
        # had no GitHub release. The bundle's .tar.gz.sha256 is the checksum to
        # trust; the per-binary bin/*.sha256 for 2.4.x does not match its file.
        env:
          XP_VERSION: v2.4.1
          XP_BUNDLE_SHA256: d533f5475aa1ea94f147b9abc0eda0c9575b4599cdc62f7ef25e496f2629fa07
        run: |
          curl -sfL -o crossplane-cli.tar.gz "https://cli.crossplane.io/stable/${XP_VERSION}/bundle/linux_amd64/crossplane-cli.tar.gz"
          echo "${XP_BUNDLE_SHA256}  crossplane-cli.tar.gz" | sha256sum -c -
          tar -xzf crossplane-cli.tar.gz crossplane
          sudo install crossplane /usr/local/bin/crossplane
          rm crossplane crossplane-cli.tar.gz
          crossplane version --client

      - name: Get Teleport version
        id: tp-version
        run: |
          VERSION=$(curl -sf "https://${{ env.TELEPORT_FQDN }}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ steps.tp-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}

      - name: Mint Teleport workload-identity JWT for AWS
        run: |
          cat > /tmp/tbot.yaml << EOF
          version: v2
          proxy_server: ${{ env.TELEPORT_FQDN }}
          onboarding:
            join_method: github
            token: ${{ env.TELEPORT_TOKEN }}
          oneshot: true
          storage:
            type: memory
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: /tmp/tbot-output
              selector:
                name: image-push
              audiences: ["sts.amazonaws.com"]
          EOF

          mkdir -p /tmp/tbot-output
          tbot start -c /tmp/tbot.yaml || true
          test -f /tmp/tbot-output/jwt_svid

      - name: Configure AWS credentials (Teleport WI → STS AssumeRoleWithWebIdentity)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          web-identity-token-file: /tmp/tbot-output/jwt_svid

      # Crossplane provider ECR repos live outside terraform by convention
      # (provider-cloudflare-pkg, sourcebot, mcp-grafana — none tf-managed).
      # Create both idempotently via the image-push WI role (already has
      # ecr:CreateRepository). MUTABLE so a workflow_dispatch re-release can
      # re-push the same tag after a transient failure. ubuntu-latest ships the
      # aws CLI. No-op once the repos exist.
      - name: Ensure ECR repositories exist
        run: |
          for repo in "${ECR_REPOSITORY}" "${ECR_REPOSITORY}-pkg"; do
            if aws ecr describe-repositories --repository-names "$repo" --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "ecr repo exists: $repo"
            else
              aws ecr create-repository --repository-name "$repo" --region "$AWS_REGION" \
                --image-tag-mutability MUTABLE >/dev/null
              echo "ecr repo created: $repo"
            fi
          done

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: "515260921971"

      - name: Set up QEMU (for cross-arch image build)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Install syft (SBOM generator)
        env:
          SYFT_VERSION: 1.42.3
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            | tar -xzC "$HOME/.local/bin" syft
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/syft" version

      - name: Build and push multi-arch image
        run: make image.buildx.push

      - name: Resolve image digest
        id: image-digest
        run: |
          digest=$(docker buildx imagetools inspect "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign image (cosign keyless / OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes "${{ steps.image-digest.outputs.image_ref }}"

      - name: Generate SBOM (SPDX JSON)
        run: |
          syft "${{ steps.image-digest.outputs.image_ref }}" \
            -o spdx-json="provider-vault-${{ env.IMAGE_TAG }}.sbom.spdx.json"

      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign attest --yes \
            --predicate "provider-vault-${{ env.IMAGE_TAG }}.sbom.spdx.json" \
            --type spdxjson \
            "${{ steps.image-digest.outputs.image_ref }}"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-vault-sbom-${{ env.IMAGE_TAG }}
          path: provider-vault-${{ env.IMAGE_TAG }}.sbom.spdx.json
          retention-days: 90

      - name: Build and push xpkg
        run: make xpkg.push

      - name: Sign xpkg (cosign keyless / OIDC)
        id: xpkg-digest
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          # The xpkg push uses a separate ECR repo (provider-vault-pkg);
          # resolve its digest the same way we did for the controller image.
          xpkg_digest=$(docker buildx imagetools inspect "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}-pkg:${{ env.IMAGE_TAG }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$xpkg_digest" >> "$GITHUB_OUTPUT"
          cosign sign --yes "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}-pkg@${xpkg_digest}"

      - name: Generate release notes
        id: notes
        run: |
          IMG="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          PKG="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}-pkg:${{ env.IMAGE_TAG }}"
          PREV_TAG=$(git tag --sort=-v:refname --list 'v*' | grep -v "^${{ env.IMAGE_TAG }}$" | head -1)
          {
            echo "body<<EOF"
            echo "Maestra fork of upbound/provider-vault with the create-only password fix for \`SecretBackendConnection\` ([upbound/provider-vault#38](https://github.com/upbound/provider-vault/issues/38))."
            echo ""
            echo "## Crossplane provider package (xpkg)"
            echo '```'
            echo "$PKG"
            echo "$PKG@${{ steps.xpkg-digest.outputs.digest }}"
            echo '```'
            echo ""
            echo "## Controller image"
            echo '```'
            echo "$IMG"
            echo "$IMG@${{ steps.image-digest.outputs.digest }}"
            echo '```'
            echo ""
            echo "Both multi-arch (linux/amd64 + linux/arm64), cosign-signed (keyless/OIDC), SBOM attached."
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "## Changes since ${PREV_TAG}"
              echo ""
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" -- . ':!*.lock' || true
              echo ""
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.IMAGE_TAG }}
          name: ${{ env.IMAGE_TAG }}
          body: ${{ steps.notes.outputs.body }}
          files: provider-vault-${{ env.IMAGE_TAG }}.sbom.spdx.json
